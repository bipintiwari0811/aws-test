AWSTemplateFormatVersion: '2010-09-09'
Description: Node.js app3 on existing ECS Fargate cluster + ALB, password from Secrets Manager

Parameters:
  ClusterName:        { Type: String }
  VpcId:              { Type: AWS::EC2::VPC::Id }
  PrivateSubnets:     { Type: List<AWS::EC2::Subnet::Id> }
  AlbListenerArn:     { Type: String }
  AlbSecurityGroupId: { Type: AWS::EC2::SecurityGroup::Id }
  EcrRepoUri:         { Type: String, Description: e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com/app3 }
  ImageTag:           { Type: String, Default: latest }   # overwritten by the pipeline on every run
  ListenerRulePriority: { Type: Number, Default: 30 }
  ContainerPort:      { Type: Number, Default: 3000 }
  DbUsername:         { Type: String, Default: appuser }

Resources:
  # ---------- Secret (generated once, kept if stack is deleted/replaced) ----------
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}/app3/db'
      Description: DB credentials for app3
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # ---------- IAM ----------
  # Execution role: used by the ECS agent to pull image + read the secret BEFORE the container starts
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app3-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret
              # Uncomment if the secret uses a customer-managed KMS key
              # - Effect: Allow
              #   Action: kms:Decrypt
              #   Resource: <your-kms-key-arn>

  # Task role: what the app itself can call at runtime (empty for now)
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # ---------- Logs ----------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/app3'
      RetentionInDays: 14

  # ---------- Task definition ----------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-app3'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app3
          Image: !Sub '${EcrRepoUri}:${ImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Environment:
            - { Name: NODE_ENV,  Value: production }
            - { Name: PORT,      Value: !Ref ContainerPort }
            - { Name: BASE_PATH, Value: /app3 }
          # Injected as env vars at task start - never visible in the task definition
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub '${AppSecret}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${AppSecret}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app3

  # ---------- Networking / ALB ----------
  ServiceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: app3 tasks - only from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroupId

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /app3/health
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: [/app3, /app3/*]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      Cluster: !Ref ClusterName
      LaunchType: FARGATE
      DesiredCount: 2
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnets
          SecurityGroups: [!Ref ServiceSG]
      LoadBalancers:
        - ContainerName: app3
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

  # ---------- Autoscaling (CPU target tracking) ----------
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${ClusterName}/${Service.Name}'
      MinCapacity: 2
      MaxCapacity: 6

  CpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: app3-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

Outputs:
  SecretArn: { Value: !Ref AppSecret }
  ServiceName: { Value: !GetAtt Service.Name }
