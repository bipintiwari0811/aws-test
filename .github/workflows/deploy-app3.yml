name: app3 CI/CD

on:
  pull_request:
    branches: [main]
    paths: ['app3/**', 'infra/app3-service.yaml', '.github/workflows/deploy-app3.yml']
  push:
    branches: [main]
    paths: ['app3/**', 'infra/app3-service.yaml', '.github/workflows/deploy-app3.yml']
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: app3
  STACK_NAME: app3-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app3/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app3/coverage
          retention-days: 7

  validate:
    name: Validate CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cfn-lint
      - run: cfn-lint infra/*.yaml

  deploy:
    name: Build & Deploy
    needs: [test, validate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-app3
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG=${GITHUB_SHA::7}
          IMAGE=$REGISTRY/$ECR_REPOSITORY
          docker build -t $IMAGE:$TAG -t $IMAGE:latest app3/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "repo_uri=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name $STACK_NAME \
            --template-file infra/app3-service.yaml \
            --capabilities CAPABILITY_IAM \
            --role-arn ${{ vars.CFN_EXECUTION_ROLE_ARN }} \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ClusterName=${{ vars.ECS_CLUSTER_NAME }} \
              VpcId=${{ vars.VPC_ID }} \
              PrivateSubnets=${{ vars.PRIVATE_SUBNETS }} \
              AlbListenerArn=${{ vars.ALB_LISTENER_ARN }} \
              AlbSecurityGroupId=${{ vars.ALB_SG_ID }} \
              EcrRepoUri=${{ steps.image.outputs.repo_uri }} \
              ImageTag=${{ steps.image.outputs.tag }} \
              ListenerRulePriority=30 \
              AssignPublicIp=${{ vars.ASSIGN_PUBLIC_IP || 'DISABLED' }}

      - name: Show stack status
        if: always()
        run: |
          aws cloudformation describe-stacks --stack-name $STACK_NAME \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' --output json || true
          if [ "${{ job.status }}" != "success" ]; then
            echo "---- Recent failures ----"
            aws cloudformation describe-stack-events --stack-name $STACK_NAME \
              --query "StackEvents[?contains(ResourceStatus,'FAILED')].[LogicalResourceId,ResourceStatusReason] | [0:5]" \
              --output text || true
          fi